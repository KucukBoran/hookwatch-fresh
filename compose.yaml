# Local demo only. Copy .env.example to .env first.
services:
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_PATH: /app/instance/hookwatch.sqlite
    ports: ["127.0.0.1:5000:5000"]
    volumes: ["event-data:/app/instance"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
  worker:
    build: .
    env_file: .env
    environment:
      DATABASE_PATH: /app/instance/hookwatch.sqlite
    volumes: ["event-data:/app/instance"]
    command: ["python", "-m", "hookwatch", "worker"]
    depends_on:
      app:
        condition: service_healthy
  prometheus:
    image: prom/prometheus:v3.7.3
    profiles: ["monitoring"]
    ports: ["127.0.0.1:9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    secrets: [metrics_token]
    depends_on:
      app:
        condition: service_healthy
  grafana:
    image: grafana/grafana:12.2.1
    profiles: ["monitoring"]
    ports: ["127.0.0.1:3000:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: demo
      GF_SECURITY_ADMIN_PASSWORD: DemoGrafana123!
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
secrets:
  metrics_token:
    environment: ADMIN_TOKEN
volumes:
  event-data:
  prometheus-data:
  grafana-data:
